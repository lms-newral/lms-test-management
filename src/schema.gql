  name: String
  price: Float
  startAt: DateTime
  targetYear: Int
}

input UpsertSolutionInput {
  contentHtml: String
  durationSec: Int

  """Omit to create."""
  id: String
  kind: SolutionKind!
  language: String
  orderIndex: Int
  videoProvider: VideoProvider
  videoUrl: String
  visibility: SolutionVisibility
}

input UseTestFormatTemplateInput {
  """Defaults to the template's name."""
  name: String

  """Only needed where a template subject name has no match in the bank."""
  subjectMap: [TemplateSubjectMapInput!]
  templateId: ID!

  """Only needed where a template type code has no match."""
  typeMap: [TemplateTypeMapInput!]
}

enum VideoProvider {
  EXTERNAL
  UPLOADED
  VIMEO
  YOUTUBE
}